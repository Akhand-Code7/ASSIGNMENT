<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC College Admission 2026</title>
    <style>
        /* I have added simple CSS to make the admission page look neat. */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        header, footer {
            background-color: #202878;
            color: white;
            text-align: center;
            padding: 15px;
        }
        main {
            max-width: 600px;
            margin: 20px auto;
            background-color: white;
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #999;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #e8e8f2;
        }
        fieldset {
            padding: 12px;
        }
        input, select, textarea {
            max-width: 100%;
            box-sizing: border-box;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <!-- Header contains the college name and admission year. -->
    <header>
        <h1>ABC College Admission 2026</h1>
    </header>

    <main>
        <!-- This table displays the available courses, seats and fees. -->
        <section aria-labelledby="courses-heading">
            <h2 id="courses-heading">Courses and Fees</h2>
            <table>
                <caption>Available Courses</caption>
                <thead>
                    <tr>
                        <th scope="col">Course</th>
                        <th scope="col">Seats</th>
                        <th scope="col">Fees</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>B.Tech CSE</td>
                        <td>120</td>
                        <td>₹90,000</td>
                    </tr>
                    <tr>
                        <td>BCA</td>
                        <td>60</td>
                        <td>₹45,000</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <!-- The application form uses labels and basic browser validation. -->
        <section aria-labelledby="application-heading">
            <h2 id="application-heading">Application Form</h2>
            <form action="#" method="post">
                <fieldset>
                    <legend>Application Form</legend>

                    <label for="student-name">Name:</label><br>
                    <input type="text" id="student-name" name="name" required>
                    <br><br>

                    <label for="student-email">Email:</label><br>
                    <input type="email" id="student-email" name="email" required>
                    <br><br>

                    <label for="student-course">Course:</label><br>
                    <select id="student-course" name="course" required>
                        <option value="B.Tech CSE">B.Tech CSE</option>
                        <option value="BCA">BCA</option>
                    </select>
                    <br><br>

                    <label for="statement">Statement:</label><br>
                    <textarea id="statement" name="statement" rows="4" cols="35"
                        required></textarea>
                    <br><br>

                    <button type="submit">Apply</button>
                </fieldset>
            </form>
        </section>
    </main>

    <!-- Footer displays the college copyright information. -->
    <footer>
        <p>&copy; 2026 ABC College</p>
    </footer>
</body>
</html>
