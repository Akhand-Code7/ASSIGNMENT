<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Headings and Formatting</title>
</head>
<body>
    <!-- I am using different heading tags to show different heading sizes. -->
    <h1>Heading 1</h1>
    <h2>Heading 2</h2>
    <h3>Heading 3</h3>

    <!-- These tags are used to format the text. -->
    <p>
        Text with <b>bold</b>, <i>italic</i>, <u>underline</u>,
        <mark>mark</mark>, H<sub>2</sub>O, x<sup>2</sup>
    </p>

    <!-- Character entities are used to display special characters. -->
    <p>&copy; &reg; &trade; &lt;tag&gt; &amp; &euro; &hearts; &starf;</p>

    <!-- The br tag moves text to the next line and hr adds a horizontal line. -->
    <hr>
    Line one<br>
    Line two
</body>
</html>
