<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotation and Citation Elements</title>
</head>
<body>
    <!-- blockquote is used for a longer quotation. -->
    <blockquote>
        The best way to predict the future is to create it.
    </blockquote>

    <!-- q is used for a short quotation inside a paragraph. -->
    <p>As he said, <q>Stay hungry, stay foolish.</q></p>

    <!-- cite represents the title of a creative work. -->
    <p>Book: <cite>The Pragmatic Programmer</cite></p>

    <!-- abbr shows its full form when the mouse is placed over it. -->
    <p><abbr title="World Wide Web Consortium">W3C</abbr> sets web standards.</p>

    <!-- address is used for contact information. -->
    <address>
        Contact: Admin Office<br>
        College Road, Delhi
    </address>

    <!-- del shows removed text and ins shows added text. -->
    <p><del>Old price 500</del> <ins>New price 400</ins></p>
</body>
</html>
