<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
</head>
<body>
    <!-- required, pattern, minlength and max help the browser validate input. -->
    <!-- The form uses POST and sends valid data to submit.php as in the assignment. -->
    <form action="submit.php" method="post">
        <input type="text" name="fullname" placeholder="Full name" required>
        <br><br>

        <input type="email" name="email" placeholder="you@college.edu" required>
        <br><br>

        <input type="tel" name="mobile" placeholder="10-digit mobile"
            pattern="[0-9]{10}" title="Enter exactly 10 digits" required>
        <br><br>

        <input type="password" name="password" placeholder="Min 6 characters"
            minlength="6" required>
        <br><br>

        <input type="number" name="age" placeholder="Age (17-30)"
            min="17" max="30" required>
        <br><br>

        <button type="submit">Register</button>
    </form>
</body>
</html>
